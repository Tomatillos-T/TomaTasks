name: OCI CI/CD Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GraalVM setup
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '22'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract files"
        run: |
          cd MtdrSpring
          wget "${{ secrets.OCI_PAR_URL }}"
          tar -xzvf deployment_config.tgz
          source env.sh

      - name: "Docker Login"
        run: |
          cd MtdrSpring
          cat at.cfg | docker login -u "axohot8ponib/a01198666@tec.mx" --password-stdin mx-queretaro-1.ocir.io

      - name: "Build"
        run: |
          cd MtdrSpring
          source env.sh
          (cd backend; source build.sh)

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
      OCI_CLI_USER:            ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY:         ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT:     ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT:     ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION:          ${{ secrets.OCI_CLI_REGION }}
      OCI_DOCKER_REPO:         ${{ secrets.OCI_DOCKER_REPO }}
      OCI_AUTH_TOKEN:          ${{ secrets.OCI_AUTH_TOKEN }}
      OCI_COMPARTMENT_OCID:    ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_CLUSTER_OCID:        ${{ secrets.OCI_CLUSTER_OCID }}
    
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '22'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Extract config"
        run: |
          cd MtdrSpring
          wget "${{ secrets.OCI_PAR_URL }}"
          tar -xzvf deployment_config.tgz
          source env.sh

      - name: Configure kubectl for OKE
        id: kubectl-oke-action
        uses: oracle-actions/configure-kubectl-oke@v1.5.0
        with:
          cluster: ${{ secrets.OCI_CLUSTER_OCID }}
        env:
          OCI_CLI_USER:        ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY:     ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION:      ${{ secrets.OCI_CLI_REGION }}

      - name: "Check existing deployment"
        id: k8scheck
        run: |
          echo "Checking for existing pods and services…"

          svc_count=$(kubectl get services -n mtdrworkshop | grep -c tomatask || true)
          pod_count=$(kubectl get pods -n mtdrworkshop | grep -c tomatask || true)

          echo "Found $svc_count services"
          echo "Found $pod_count pods"

          if [ "$svc_count" -gt 1 ] || [ "$pod_count" -gt 0 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: "Run undeployment"
        if: steps.k8scheck.outputs.exists == 'true'
        run: |
          echo "Existing resources detected — running undeploy.sh"
          cd MtdrSpring/backend
          ./undeploy.sh

      - name: "Deploy"
        run: |
          echo "Starting new deployment…"
          cd MtdrSpring/backend
          ./deploy.sh
