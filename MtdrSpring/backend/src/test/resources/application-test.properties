# H2 In-Memory Database for E2E Testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Oracle UCP for tests
spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# Disable Telegram bot for tests
telegram.bot.token=test-token
telegram.bot.name=TestBot

# JWT Configuration for tests
security.jwt.secret-key=testsecretkey123456789012345678901234567890123456789012345678901234
security.jwt.expiration-time=3600000

# Disable SQL init
spring.sql.init.mode=never

# Logging
logging.level.root=WARN
logging.level.com.springboot.TomaTask=DEBUG
logging.level.org.springframework.security=DEBUG
